function cycleInfo(d){const st=[...(S.cycle.starts||[])].sort();if(!st.length)return null;
 let len=28;if(st.length>=2){const ds=[];for(let i=Math.max(1,st.length-6);i<st.length;i++)ds.push(diffD(st[i],st[i-1]));const ok=ds.filter(x=>x>=20&&x<=45);if(ok.length)len=Math.round(ok.reduce((a,b)=>a+b,0)/ok.length);}
 const last=st.filter(s=>s<=d).pop();if(!last)return null;const day=diffD(d,last)+1;const next=addD(last,len);
 let phase,ph;if(day<=5){phase='Menstruação';ph='men';}else if(day<len-15){phase='Fase folicular';ph='fol';}else if(day<=len-13){phase='Ovulação';ph='ovu';}else if(day<=len){phase='Fase lútea';ph='lut';}else{phase='Atrasada';ph='late';}
 return{last,len,day,next,phase,ph,pre:day>len-7&&day<=len,toNext:diffD(next,d)};}
function retentionDay(d){const c=cycleInfo(d);return !!c&&(c.pre||c.day<=3);}

/* ---------- humor do Rolinho ---------- */
const PHR={
 sonolento:['Quero cafééééééé!','Bom dia… me alimenta? Começa pela água.'],
 fome:['Eu tô com fome e quero merendar!','Tô ficando de cara amarrada… cadê meu lanche?'],
 preocupado:['Não sou obrigado a passar o dia só no cafezinho, né?','Comeu tão pouquinho hoje… bora uma proteína?'],
 contente:['É sobre isso. E tá tudo bem.','Tá indo bem! Segue me alimentando direitinho.'],
 radiante:['Mãe tá on!','Dia perfeito! Eu tô brilhando, e você também.'],
 demonio:['Você não vai me negar um prato de comida, vai?!','Fome, sede e noite mal dormida = DEMÔNIO. Me alimenta AGORA!']};
const MOOD_NAME={sonolento:'Sonolento',fome:'Com fome ou sede',preocupado:'Preocupado',contente:'Contente',radiante:'Radiante',demonio:'Demônio'};
function moodOf(d){const E=dayEntries(d),t=tot(E),G=S.goals,w=waterOf(d),vf=E.some(e=>e.vf);
 const isToday=d===today();
 if(t.kcal===0&&w===0&&(!isToday||new Date().getHours()<11))return 'sonolento';
 if(w>=G.water&&t.p>=G.p*0.9&&vf)return 'radiante';
 if(isToday){const now=Date.now(),h=new Date().getHours();
  const lastF=Math.max(0,...E.map(e=>e.t||0)),lastW=Math.max(0,...S.water.filter(x=>x.date===d).map(x=>x.t||0));
  const hungry=h>=10&&h<23&&(!lastF||now-lastF>4*36e5),thirsty=h>=10&&h<23&&w<G.water&&(!lastW||now-lastW>3*36e5);
  const sleepBad=(S.checkins[d]||{}).sleep==='mal';
  if(sleepBad&&(hungry||thirsty))return 'demonio';
  if(hungry||thirsty)return 'fome';
  if(h>=16&&(t.kcal<G.kcal*0.5||t.p<G.p*0.4))return 'preocupado';
  return 'contente';}
 if(t.kcal<G.kcal*0.5||t.p<G.p*0.4)return 'preocupado';
 return 'contente';}
function phraseOf(m){const a=PHR[m];const now=new Date();return a[(now.getDate()+now.getHours())%a.length];}

 <div class="card" style="padding:4px 14px;gap:0">${es.map(e=>`<div class="item"><div class="grow"><div class="nm">${esc(e.name)}</div><div class="xs m">${esc(e.qtyText)} · P ${nf(e.p)} · C ${nf(e.c)} · G ${nf(e.g)}</div></div><span class="s b">${nf(e.kcal)} kcal</span><button class="x" data-act="delEntry" data-v="${e.id}" aria-label="Remover">×</button></div>`).join('')}</div>`;});
 h+=`<button class="fab" data-act="go" data-v="buscar">+ Adicionar</button>`;return h;};
function segCk(f,opts,val){return `<div class="seg" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(([v,l])=>`<button class="${val===v?'on':''}" data-act="ck" data-f="${f}" data-v="${v}">${l}</button>`).join('')}</div>`;}
function forecast(){const days=loggedDays();const cum=days.reduce((a,d)=>a+defOf(d),0);const pos=Math.max(0,cum);const kg=Math.floor(pos/7700),into=pos-kg*7700;
 const recent=days.slice(-14);const avg=recent.length?recent.reduce((a,d)=>a+defOf(d),0)/recent.length:0;const basis=recent.length>=3?avg:(S.profile?S.profile.def:0);
 let text;if(!days.length)text='A conta começa amanhã, com o dia de hoje fechado.';else if(basis>0){const n=Math.ceil((7700-into)/basis);text=`Estimativa: <b>~${n} dia${n>1?'s':''}</b> para o próximo 1 kg, no ritmo ${recent.length>=3?'dos últimos dias':'planejado'}.`;}
 else text='No ritmo atual não há déficit. Tudo bem: amanhã é outro dia.';
 return{cum,into:Math.round(into),kg,avg,text,days};}

SCREENS.historico=()=>{const n=UI.hist;const days=Array.from({length:n},(_,i)=>addD(today(),i-n+1));const G=S.goals;
 const vals=days.map(d=>tot(dayEntries(d)).kcal);const g0=baseGasto();const max=Math.max(G.kcal*1.3,g0*1.05,...vals,1);
 const H=150;let h=`<h1>Histórico</h1>${seg('hist',[[7,'7 dias'],[30,'30 dias']],n)}`;
 h+=`<div class="card"><div class="row s m" style="gap:14px;flex-wrap:wrap"><span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:var(--pink)"></span>Consumido</span><span class="row" style="gap:5px"><span style="width:14px;border-top:2px dashed var(--ink)"></span>Meta ${nf(G.kcal)}</span>${g0?`<span class="row" style="gap:5px"><span style="width:14px;border-top:2px dotted var(--G)"></span>Gasto ~${nf(g0)}</span>`:''}</div>
 <div style="position:relative;height:${H}px;display:grid;grid-template-columns:repeat(${n},1fr);gap:${n>10?2:8}px;align-items:end;border-bottom:1px solid var(--line)" role="img" aria-label="Calorias por dia">
 <div style="position:absolute;left:0;right:0;bottom:${G.kcal/max*H}px;border-top:2px dashed var(--ink);opacity:.6"></div>${g0?`<div style="position:absolute;left:0;right:0;bottom:${g0/max*H}px;border-top:2px dotted var(--G)"></div>`:''}
 ${vals.map((v,i)=>`<div style="height:${Math.max(v?3:0,v/max*H)}px;background:${days[i]===today()?'var(--chip)':'var(--pink)'};border-radius:5px 5px 0 0"></div>`).join('')}</div>
 ${n<=7?`<div style="display:grid;grid-template-columns:repeat(${n},1fr);gap:8px;text-align:center" class="xs m">${days.map(d=>`<span>${d===today()?'Hoje':ddmm(d).slice(0,2)}</span>`).join('')}</div>`:''}</div>`;
 const done=days.filter(d=>d<today()&&dayEntries(d).length);
 if(done.length){const avg=done.reduce((a,d)=>a+tot(dayEntries(d)).kcal,0)/done.length;h+=`<div class="grid2"><div class="card" style="gap:2px"><span class="s m">Média consumida</span><span class="mid">${nf(avg)} <span class="s m">kcal</span></span></div><div class="card" style="gap:2px"><span class="s m">Déficit médio</span><span class="mid acc">${S.profile?nf(done.reduce((a,d)=>a+defOf(d),0)/done.length):'—'} <span class="s m">kcal/dia</span></span></div></div>`;}
 h+=`<div class="card" style="padding:4px 14px;gap:0">${days.slice().reverse().map(d=>{const k=tot(dayEntries(d)).kcal;if(!k&&d!==today())return '';return `<button class="item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;cursor:pointer;text-align:left" data-act="openDay" data-v="${d}"><span class="grow b s">${dayTitle(d)}</span><span class="s">${nf(k)} kcal${S.profile&&d<today()?` · <span class="acc b">${defOf(d)>=0?'−':'+'}${nf(Math.abs(defOf(d)))}</span>`:''}</span></button>`;}).join('')||'<div class="empty">Ainda sem registros.</div>'}</div>`;
 return h;};

/* progresso */
SCREENS.progresso=()=>{let h='<h1>Progresso</h1>';const days=loggedDays();
 if(S.profile&&days.length){const cum=Math.max(0,days.reduce((a,d)=>a+defOf(d),0));h+=`<div class="card lil" style="gap:4px"><span class="s b m">Déficit acumulado desde ${ddmm(days[0])}</span><div class="row" style="align-items:baseline;gap:6px"><span class="big" style="font-size:30px">${nf(cum)}</span><span class="m">kcal em ${days.length} dia${days.length>1?'s':''}</span></div><span class="s">≈ <b>${nf(cum/7700,1)} kg</b> de gordura · sequência de ${streak()} dia${streak()===1?'':'s'}</span></div>`;}
 else h+=`<div class="card lil"><span class="s m">O contador de déficit começa quando você preencher <b>Meus dados</b> e fechar o primeiro dia com registros.</span></div>`;
 const W=sortedWeights();
 h+=`<div class="card"><div class="row sb" style="align-items:baseline"><div><div class="s m">Peso atual</div><div class="mid">${W.length?nf(W[W.length-1].kg,1)+' kg':'—'}</div></div>${W.length>1?`<span class="s b acc">${W[W.length-1].kg<=W[0].kg?'−':'+'}${nf(Math.abs(W[W.length-1].kg-W[0].kg),1)} kg desde ${ddmm(W[0].date)}</span>`:''}</div>${weightChart(W)}
 <div class="row"><input class="inp grow" id="wIn" inputmode="decimal" placeholder="Peso de hoje (kg)"><button class="btn" style="width:auto" data-act="addWeight">Registrar</button></div>
 <span class="xs m">Pese uma vez por semana, em jejum, no mesmo dia.${cycleInfo(today())&&retentionDay(today())?' Esta semana pode ter retenção pelo ciclo: ela conta menos no ajuste.':''}</span></div>`;
 const cal=calibration();if(cal)h+=`<div class="card"><span class="s">${cal.text}</span>${cal.adj!=null?`<button class="btn2" style="background:var(--chip);border-color:var(--chipb);color:var(--chipt)" data-act="applyCal">Aplicar ajuste e nova meta</button>`:''}</div>`;
 h+=`<div class="grid2">${[['monjaro','Monjaro','syr'],['ciclo','Ciclo e bem-estar','user'],['conquistas','Conquistas','star'],['resumo','Resumo da semana','bars']].map(([r,l,i])=>`<button class="card" style="cursor:pointer;align-items:flex-start" data-act="go" data-v="${r}">${ico(i,'acc')}<span class="b s">${l}</span></button>`).join('')}</div>`;
 return h;};
function weightChart(W){if(W.length<2)return '<div class="xs m">O gráfico aparece a partir da 2ª pesagem.</div>';const pts=W.slice(-12);const mn=Math.min(...pts.map(p=>p.kg))-0.5,mx=Math.max(...pts.map(p=>p.kg))+0.5;
 const w=320,hh=90,x=i=>14+i*(w-28)/(pts.length-1),y=k=>8+(mx-k)/(mx-mn)*(hh-24);
 return `<svg viewBox="0 0 ${w} ${hh}" width="100%" role="img" aria-label="Evolução do peso"><polyline points="${pts.map((p,i)=>x(i)+','+y(p.kg)).join(' ')}" fill="none" stroke="#E99BBA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.kg)}" r="4" fill="${retentionDay(p.date)?'#C9A6EC':'#E99BBA'}"/>`).join('')}<text x="${x(0)}" y="${hh-2}" font-size="10" fill="currentColor" opacity=".6">${ddmm(pts[0].date)}</text><text x="${x(pts.length-1)}" y="${hh-2}" font-size="10" fill="currentColor" opacity=".6" text-anchor="end">${ddmm(pts[pts.length-1].date)}</text></svg>`;}
function calibration(){if(!S.profile)return null;const W=sortedWeights().filter(w=>!retentionDay(w.date));if(W.length<2)return{text:'Com 2 pesagens (fora dos dias de retenção) e pelo menos 14 dias de registros entre elas, o app compara a balança com a conta e ajusta o seu gasto real.'};
 const a=W[0],b=W[W.length-1];const span=diffD(b.date,a.date);if(span<14)return{text:`Faltam ${14-span} dias entre a primeira e a última pesagem para o app ajustar o seu gasto.`};
 const ds=loggedDays().filter(d=>d>=a.date&&d<b.date);if(ds.length<span*0.7)return{text:'Para ajustar o gasto com segurança, registre pelo menos 70% dos dias entre as pesagens.'};
 const pred=ds.reduce((x,d)=>x+defOf(d),0),real=(a.kg-b.kg)*7700;const adj=clamp(Math.round((real-pred)/ds.length),-600,600);
 if(Math.abs(adj)<50)return{text:`A balança está batendo com a conta. Seu gasto estimado de <b>~${nf(baseGasto())} kcal</b> está bom.`};
 return{adj,text:`Pela balança, seu gasto real parece ser <b>~${nf(baseGasto()+adj)} kcal</b> (a conta dizia ${nf(baseGasto())}). Meta sugerida: <b>${nf(Math.max(S.profile.sex==='M'?1500:1200,Math.round(baseGasto()+adj-S.profile.def)))} kcal</b>.`};}

SCREENS.atividade=()=>{const a=UI.draftAct;return header('Registrar atividade',dayTitle(UI.day))+`<h2>Tipo</h2><div class="grid3">${Object.keys(MET).map(t=>`<button class="chip ${a.type===t?'on':''}" style="height:44px;border-radius:12px" data-act="set" data-k="draftAct.type" data-v="${t}">${t}</button>`).join('')}</div>
 <h2>Intensidade</h2><div class="grid3">${[['Leve','conversa fácil'],['Moderada','fôlego curto'],['Intensa','difícil falar']].map(([t,d])=>`<button class="chip ${a.int===t?'on':''}" style="height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center" data-act="set" data-k="draftAct.int" data-v="${t}"><span>${t}</span><span class="xs m">${d}</span></button>`).join('')}</div>
 <h2>Duração (minutos)</h2><div class="grid4">${[15,30,45,60].map(m=>`<button class="chip ${a.min===m?'on':''}" style="border-radius:12px" data-act="set" data-k="draftAct.min" data-v="${m}">${m}</button>`).join('')}</div>
 <label class="row s m">Outro tempo <input class="inp" style="width:90px" inputmode="numeric" data-in="draftAct.min" value="${a.min}"></label>
 <div class="card lil" style="gap:2px"><span class="s m">Gasto estimado</span><span class="big" style="font-size:30px">≈ ${nf(actKcal(a))} kcal</span><span class="s m">Pelo seu peso e pela intensidade. Entra no déficit do dia.</span></div>
 <button class="btn" data-act="saveAct">Salvar atividade</button>`;};

/* perfil */
SCREENS.perfil=()=>{const P=S.profile||{sex:'F',age:'',weight:'',height:'',act:1.375,def:500};UI.pf=UI.pf||Object.assign({},P);const f=UI.pf;const G=S.goals;
 let h=`<h1>Meus dados</h1><div class="card">${seg('pf.sex',[['F','Feminino'],['M','Masculino']],f.sex)}
 <div class="grid3"><label class="f">Idade<input class="inp" inputmode="numeric" data-in="pf.age" value="${esc(f.age)}"></label><label class="f">Peso (kg)<input class="inp" inputmode="decimal" data-in="pf.weight" value="${esc(f.weight)}"></label><label class="f">Altura (cm)<input class="inp" inputmode="numeric" data-in="pf.height" value="${esc(f.height)}"></label></div>
 <label class="f">Rotina, sem contar os treinos<select class="inp" data-in="pf.act">${[[1.2,'Sentada a maior parte do dia'],[1.375,'Em pé às vezes, anda um pouco'],[1.55,'Em pé quase o dia todo'],[1.725,'Trabalho físico pesado']].map(([v,l])=>`<option value="${v}" ${Number(f.act)===v?'selected':''}>${l}</option>`).join('')}</select></label>
 <span class="xs m">Os treinos você registra em Atividade, e eles somam no gasto do dia.</span>
 <span class="s m">Déficit diário</span>${seg('pf.def',[[300,'300 kcal'],[500,'500 kcal'],[750,'750 kcal']],f.def)}
 <button class="btn" data-act="calcGoals">Calcular minhas metas</button></div>`;
 if(S.profile)h+=`<div class="card lil"><div class="grid2"><div><div class="s m">Metabolismo basal</div><div class="b">${nf(bmr())} kcal</div></div><div><div class="s m">Gasto diário</div><div class="b">≈ ${nf(baseGasto())} kcal</div></div></div></div>`;
 h+=`<h2>Metas diárias (pode ajustar)</h2><div class="card"><div class="grid3">${[['kcal','Calorias'],['p','Proteína (g)'],['c','Carbo (g)'],['g','Gordura (g)'],['f','Fibras (g)'],['water','Água (ml)']].map(([k,l])=>`<label class="f">${l}<input class="inp" inputmode="numeric" data-in="goal.${k}" value="${G[k]}"></label>`).join('')}</div></div>`;
 h+=`<h2>Aparência</h2>${seg('theme',[['auto','Automático'],['claro','Claro'],['escuro','Escuro']],S.theme)}`;
 h+=`<div class="card" style="padding:4px 14px;gap:0">${[['lembretes','Lembretes e notificações','bell'],['conquistas','Conquistas do Rolinho','star'],['resumo','Resumo da semana','bars'],['relatorio','Relatório para a consulta (PDF)','doc']].map(([r,l,i])=>`<button class="item" style="width:100%;border-left:0;border-right:0;border-top:0;background:transparent;cursor:pointer;text-align:left" data-act="go" data-v="${r}">${ico(i,'acc')}<span class="grow b s">${l}</span>${ico('fwd','m')}</button>`).join('')}</div>`;
 h+=`<h2>Backup</h2><div class="grid2"><button class="btn2" data-act="exportB">Exportar backup</button><button class="btn2" data-act="importB">Importar backup</button></div><span class="xs m">Faça um backup de vez em quando e guarde no Drive. Se trocar de celular ou desinstalar o app, é ele que traz seus dados de volta.</span>
 <span class="xs m" style="text-align:center;margin-top:10px">Meu Monstrinho · valores dos alimentos aproximados, baseados na Tabela TACO e no Open Food Facts. Não substitui orientação médica ou nutricional.</span>`;
 return h;};

/* lembretes */
SCREENS.lembretes=()=>{const R=S.rem,m=R.meals;const times=mealTimes();
 const sw=(k,on)=>`<button class="sw ${on?'on':''}" data-act="tog" data-k="${k}" aria-pressed="${on}" aria-label="Ligar ou desligar"></button>`;
 return header('Lembretes')+`<div class="card"><div class="row"><div class="grow"><div class="b">Refeições</div><div class="xs m">Avisa na hora de cada refeição</div></div>${sw('meals.on',m.on)}</div>
 <div class="row sb"><span class="s">Refeições por dia</span><div class="row" style="gap:8px"><button class="icon" data-act="remN" data-v="-1">−</button><b style="min-width:20px;text-align:center">${m.count}</b><button class="icon" data-act="remN" data-v="1">+</button></div></div>
 <label class="row sb s">Primeira refeição<input type="time" class="inp" style="width:120px" data-in="rem.meals.first" value="${m.first}"></label>
 <span class="s m">Intervalo</span>${seg('rem.meals.interval',[[120,'2 h'],[150,'2h30'],[180,'3 h'],[240,'4 h']],m.interval)}
 <div class="chips">${times.map(t=>`<span class="chip" style="height:30px;display:flex;align-items:center;cursor:default">${t}</span>`).join('')}</div>
 <div class="row" style="border-top:1px solid var(--div);padding-top:10px"><span class="grow s">Avisar se eu ficar mais de 4 h sem registrar comida</span>${sw('meals.fast',m.fast)}</div></div>
 <div class="card"><div class="row"><div class="grow"><div class="b">Água</div><div class="xs m">Só avisa se a meta do dia ainda não foi batida</div></div>${sw('water.on',R.water.on)}</div>
 <span class="s m">A cada</span>${seg('rem.water.every',[[60,'1 h'],[90,'1h30'],[120,'2 h'],[180,'3 h']],R.water.every)}
 <div class="grid2"><label class="f">Das<input type="time" class="inp" data-in="rem.water.from" value="${R.water.from}"></label><label class="f">Até<input type="time" class="inp" data-in="rem.water.to" value="${R.water.to}"></label></div></div>
 <div class="card"><div class="row"><div class="grow"><div class="b">Prioridade de proteína</div><div class="xs m">Avisa se você estiver abaixo da metade da meta</div></div>${sw('protein.on',R.protein.on)}</div>
 <label class="row sb s">Horário<input type="time" class="inp" style="width:120px" data-in="rem.protein.at" value="${R.protein.at}"></label></div>
 <div class="card"><div class="row"><div class="grow"><div class="b">Monjaro</div><div class="xs m">Véspera às 20:00 e no dia às 09:00</div></div>${sw('mj.on',R.mj.on)}</div></div>
 ${HAS_ANDROID?`<button class="btn2" data-act="battery">Os lembretes estão atrasando? Liberar da economia de bateria</button>`:`<span class="xs m">Os lembretes funcionam no app instalado no celular.</span>`}`;};
function mealTimes(){const m=S.rem.meals;const[h0,m0]=m.first.split(':').map(Number);const out=[];for(let i=0;i<m.count;i++){const t=h0*60+m0+i*m.interval;if(t>=24*60)break;out.push(pad(Math.floor(t/60))+':'+pad(t%60));}return out;}

/* ciclo */
SCREENS.ciclo=()=>{const c=cycleInfo(today());let h=header('Ciclo e bem-estar');
 if(c){const segs=Array.from({length:c.len},(_,i)=>{const d=i+1;const col=d<=5?'var(--P)':d<c.len-15?'var(--chip)':d<=c.len-13?'var(--G)':'var(--lilb)';return `<span style="height:18px;border-radius:3px;background:${col};${d===c.day?'outline:2px solid var(--ink);outline-offset:1px':''}"></span>`}).join('');
  h+=`<div class="card lil"><div class="row sb"><div><div class="s m">${c.phase}</div><div class="mid">Dia ${c.day} de ${c.len}</div></div><div class="s" style="text-align:right">Próxima menstruação<br><b>~${ddmm(c.next)}</b>${c.toNext>0?' · em '+c.toNext+' dias':''}</div></div>
  <div style="display:grid;grid-template-columns:repeat(${c.len},1fr);gap:2px" role="img" aria-label="Linha do ciclo">${segs}</div>
  <div class="row xs m" style="flex-wrap:wrap;gap:10px">${[['Menstruação','var(--P)'],['Folicular','var(--chip)'],['Ovulação','var(--G)'],['Lútea','var(--lilb)']].map(([l,c2])=>`<span class="row" style="gap:4px"><span style="width:10px;height:10px;border-radius:3px;background:${c2}"></span>${l}</span>`).join('')}</div></div>`;
  if(c.pre)h+=`<div class="card pinkc"><b>Nos próximos dias</b><span class="s">É comum reter líquido, o peso subir um pouco e a energia cair. Não é gordura: as pesagens desses dias contam menos no ajuste do seu gasto.</span></div>`;}
 else h+=`<div class="card lil"><span class="s">Marque quando a menstruação começar. O app aprende a duração do seu ciclo e avisa os dias de retenção de líquido.</span></div>`;
 h+=`<div class="grid2"><button class="btn" data-act="periodToday">Menstruação começou hoje</button><label class="f" style="justify-content:flex-end">Ou escolha a data<input type="date" class="inp" id="perDate" max="${today()}" data-in="perDate"></label></div>`;
 if((S.cycle.starts||[]).length)h+=`<div class="xs m">Registros: ${S.cycle.starts.slice().sort().reverse().slice(0,6).map(s=>`${ddmm(s)} <button class="x" style="width:22px;height:22px;font-size:14px" data-act="delPeriod" data-v="${s}">×</button>`).join(' · ')}</div>`;
 const ck=S.checkins[today()]||{};const sy=ck.sym||[];
 h+=`<div class="card"><span class="b">Sintomas hoje</span><div class="chips">${['Inchaço','Cólica','Dor de cabeça','Vontade de doce','Sono ruim','Acne'].map(s=>`<button class="chip ${sy.includes(s)?'on':''}" data-act="sym" data-v="${s}">${s}</button>`).join('')}</div></div>`;
 const days=Array.from({length:7},(_,i)=>addD(today(),i-6));const col={otimo:'#F29CB5',bem:'#F5B8CF',ok:'#E3D3F3',cansada:'#C9A6EC',mal:'#9C7BC4'};const en={baixa:1,media:2,alta:3};
 h+=`<div class="card"><span class="b">Humor e energia · 7 dias</span><div class="grid4" style="grid-template-columns:repeat(7,1fr);text-align:center">${days.map(d=>{const k=S.checkins[d]||{};return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span style="width:22px;height:22px;border-radius:50%;background:${k.mood?col[k.mood]:'var(--div)'}"></span><div style="width:8px;height:36px;border-radius:4px;background:var(--div);display:flex;align-items:flex-end"><div style="width:8px;height:${(en[k.energy]||0)*12}px;border-radius:4px;background:var(--C)"></div></div><span class="xs m">${d===today()?'Hoje':ddmm(d).slice(0,2)}</span></div>`}).join('')}</div>
 <div class="row xs m" style="gap:10px;flex-wrap:wrap">${[['Ótimo','otimo'],['Bem','bem'],['Ok','ok'],['Cansada','cansada'],['Mal','mal']].map(([l,k])=>`<span class="row" style="gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:${col[k]}"></span>${l}</span>`).join('')}<span class="row" style="gap:4px"><span style="width:8px;height:10px;border-radius:3px;background:var(--C)"></span>Energia</span></div></div>`;
 return h;};

/* monjaro */
const SITES=['Abdômen esquerdo','Abdômen direito','Coxa esquerda','Coxa direita','Braço esquerdo','Braço direito'];
function mjLast(){const a=[...S.mj.apps].sort((x,y)=>x.date<y.date?-1:1);return a[a.length-1]||null;}
function mjNext(){const l=mjLast();return l?addD(l.date,7):null;}
function nextSite(){const l=mjLast();if(!l)return SITES[0];const i=SITES.indexOf(l.site);return SITES[(i+1)%SITES.length];}
const SIDES=[['nausea','Náusea'],['intestino','Intestino preso'],['azia','Azia'],['apetite','Sem apetite'],['cansaco','Cansaço']];
SCREENS.monjaro=()=>{const l=mjLast(),nx=mjNext();const sd=S.mj.sides[today()]||{};UI.mjf=UI.mjf||{date:today(),dose:S.mj.dose||'',site:nextSite()};const f=UI.mjf;
 let h=header('Monjaro','Sob orientação médica');
 h+=`<div class="card lil"><div class="grid2"><div><div class="s m">Próxima aplicação</div><div class="b">${nx?WD[parseD(nx).getDay()]+', '+ddmm(nx):'—'}</div></div><div><div class="s m">Última</div><div class="b">${l?ddmm(l.date)+' · '+esc(l.site):'—'}</div></div><div><div class="s m">Dose (da receita)</div><div class="b">${esc((l&&l.dose)||S.mj.dose||'—')}</div></div><div><div class="s m">Próximo local no rodízio</div><div class="b">${nextSite()}</div></div></div></div>`;
 h+=`<div class="card"><span class="b">Registrar aplicação</span><div class="grid2"><label class="f">Data<input type="date" class="inp" data-in="mjf.date" value="${f.date}" max="${today()}"></label><label class="f">Dose (como está na receita)<input class="inp" data-in="mjf.dose" value="${esc(f.dose)}" placeholder="ex.: 2,5 mg"></label></div>
 <label class="f">Local<select class="inp" data-in="mjf.site">${SITES.map(s=>`<option ${f.site===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="btn" data-act="saveMj">Salvar aplicação</button></div>`;
 h+=`<div class="card" style="gap:4px"><span class="b">Como você se sente hoje?</span>${SIDES.map(([k,l])=>`<div class="row sb" style="padding:4px 0"><span class="s b">${l}</span><div class="row" style="gap:4px">${['Não','Leve','Forte'].map((t,i)=>`<button class="chip ${(sd[k]||0)===i?'on':''}" style="height:34px" data-act="side" data-k="${k}" data-v="${i}">${t}</button>`).join('')}</div></div>`).join('')}</div>`;
 if(l){const days=Array.from({length:7},(_,i)=>addD(l.date,i));h+=`<div class="card"><span class="b">Semana desde a aplicação</span><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">${days.map((d,i)=>{const s=S.mj.sides[d]||{};const dots=SIDES.filter(([k])=>s[k]>0).map(([k])=>({nausea:'var(--P)',intestino:'var(--C)',azia:'var(--G)',apetite:'var(--F)',cansaco:'#B9A9C2'}[k]));return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><span class="xs m">${WD[parseD(d).getDay()]}</span><div style="width:34px;height:48px;border-radius:10px;border:1px solid var(--line);background:${i===0?'var(--lil)':'var(--bg)'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px">${dots.map(c=>`<span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>`).join('')}</div><span class="xs acc b">${i===0?'Apl.':''}</span></div>`}).join('')}</div>
 <div class="row xs m" style="gap:8px;flex-wrap:wrap">${[['Náusea','var(--P)'],['Intestino','var(--C)'],['Azia','var(--G)'],['Sem apetite','var(--F)'],['Cansaço','#B9A9C2']].map(([t,c])=>`<span class="row" style="gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>${t}</span>`).join('')}</div></div>`;}
 h+=`<button class="btn2" data-act="go" data-v="relatorio">${ico('doc')} Relatório para a consulta (PDF)</button>`;
 if(S.mj.apps.length)h+=`<h2>Aplicações</h2><div class="card" style="padding:4px 14px;gap:0">${[...S.mj.apps].sort((a,b)=>a.date<b.date?1:-1).slice(0,8).map(a=>`<div class="item"><span class="grow s"><b>${ddmm(a.date)}</b> · ${esc(a.dose||'')} · ${esc(a.site)}</span><button class="x" data-act="delMj" data-v="${a.id}">×</button></div>`).join('')}</div>`;
 h+=`<span class="xs m" style="text-align:center">O app só registra. Dose e ajustes ficam com o seu médico.</span>`;return h;};

/* conquistas */
SCREENS.conquistas=()=>{const A=achievements();const st=streak();
 return header('Conquistas do Rolinho')+`<div class="card lil" style="flex-direction:row;align-items:center"><div style="flex-shrink:0">${rolinho(110,'radiante',S.wear)}</div><div><div class="s m">Sequência atual</div><div class="mid">${st} dia${st===1?'':'s'}</div><div class="s">Usando: <b>${S.wear?ACC[S.wear].n:'nada'}</b></div></div></div>
 <h2>Acessórios · toque para vestir</h2><div class="grid3">${Object.entries(ACC).map(([k,a])=>{const[v,goal]=A[k];const on=v>=goal;return `<button class="badge ${on?'on':'lock'}" ${on?`data-act="wear" data-v="${k}"`:''}><div style="width:58px;height:58px;border-radius:50%;background:${on?'var(--chip)':'var(--div)'};display:flex;align-items:center;justify-content:center;overflow:hidden">${rolinho(54,'contente',k)}</div><span class="s b">${a.n}</span><span class="xs m">${a.d}</span><span class="xs b ${on?'acc':'m'}">${on?(S.wear===k?'Vestindo':'Desbloqueado'):Math.min(v,goal)+'/'+goal}</span></button>`}).join('')}</div>`;};

/* resumo */
SCREENS.resumo=()=>{const days=Array.from({length:7},(_,i)=>addD(today(),i-7));const done=days.filter(d=>dayEntries(d).length);const G=S.goals;
 let h=header('Sua semana',ddmm(days[0])+' a '+ddmm(days[6]));
 if(!done.length)return h+'<div class="card"><div class="empty">Ainda não há dias registrados na última semana.</div></div>';
 const av=k=>done.reduce((a,d)=>a+tot(dayEntries(d))[k],0)/done.length;const wav=days.reduce((a,d)=>a+waterOf(d),0)/7;
 const defW=S.profile?done.reduce((a,d)=>a+defOf(d),0):null;
 const score=d=>{const t=tot(dayEntries(d));return Math.min(1,waterOf(d)/G.water)+Math.min(1,t.p/G.p)+(dayEntries(d).some(e=>e.vf)?1:0);};
 const best=done.slice().sort((a,b)=>score(b)-score(a))[0];
 const msg=av('p')<G.p*0.7?'Semana boa! Só faltou proteína. Bora caprichar nessa?':wav<G.water*0.7?'Semana boa! Só faltou água. Me dá mais um copinho?':'Que semana! Eu tô muito bem alimentado.';
 const st=(l,v,s)=>`<div class="card" style="gap:2px;padding:12px 14px"><span class="s m">${l}</span><span class="mid" style="font-size:20px">${v}</span>${s?`<span class="xs m">${s}</span>`:''}</div>`;
 h+=`<div class="card lil" style="flex-direction:row;align-items:center"><div style="flex-shrink:0">${rolinho(100,'contente',S.wear)}</div><span class="s">${msg}</span></div>
 <div class="grid2">${defW!=null?st('Déficit da semana',nf(defW)+' kcal','≈ '+nf(defW/7700,1)+' kg de gordura'):''}${st('Dias registrados',done.length+' de 7','sequência de '+streak()+' dias')}${st('Média de calorias',nf(av('kcal'))+' kcal','meta '+nf(G.kcal))}${st('Proteína média',nf(av('p'))+' g',nf(av('p')/G.p*100)+'% da meta')}${st('Água média',nf(wav/1000,1)+' L','meta '+nf(G.water/1000,1)+' L')}${st('Fibras médias',nf(av('f'))+' g','meta '+G.f+' g')}</div>
 <div class="card" style="flex-direction:row;align-items:center">${ico('star','acc')}<span class="s">Melhor dia: <b>${WDL[parseD(best).getDay()]}, ${ddmm(best)}</b>.</span></div>
 <button class="btn" data-act="shareWeek">Compartilhar resumo</button>`;return h;};
function weekText(){const days=Array.from({length:7},(_,i)=>addD(today(),i-7));const done=days.filter(d=>dayEntries(d).length);if(!done.length)return '';const av=k=>done.reduce((a,d)=>a+tot(dayEntries(d))[k],0)/done.length;
 return `Minha semana no Meu Monstrinho (${ddmm(days[0])} a ${ddmm(days[6])}):\n• ${done.length} de 7 dias registrados\n• Média: ${nf(av('kcal'))} kcal, ${nf(av('p'))} g de proteína\n${S.profile?'• Déficit: '+nf(done.reduce((a,d)=>a+defOf(d),0))+' kcal\n':''}Alimente seu monstrinho!`;}

/* relatório */
SCREENS.relatorio=()=>{const start=addD(today(),-30);const days=loggedDays().filter(d=>d>=start);const G=S.goals;
 const av=k=>days.length?days.reduce((a,d)=>a+tot(dayEntries(d))[k],0)/days.length:0;const W=sortedWeights().filter(w=>w.date>=start);
 const apps=S.mj.apps.filter(a=>a.date>=start).sort((a,b)=>a.date<b.date?-1:1);
 const sideCount={};Object.entries(S.mj.sides).filter(([d])=>d>=start).forEach(([d,s])=>SIDES.forEach(([k,l])=>{if(s[k]>0)sideCount[l]=(sideCount[l]||0)+1;}));
 const P=S.profile;const wavg=days.length?Array.from({length:30},(_,i)=>waterOf(addD(today(),-i))).reduce((a,b)=>a+b,0)/30:0;
 return `<div class="row noprint"><button class="icon" data-act="back" aria-label="Voltar">${ico('back')}</button><h1 class="grow" style="font-size:22px">Relatório</h1><button class="btn" style="width:auto" data-act="print">Salvar PDF</button></div>
 <div class="card"><div class="b" style="font-size:18px">Relatório · Meu Monstrinho</div><div class="s m">Período: ${ddmm(start)} a ${ddmm(today())}${P?` · ${P.sex==='F'?'Feminino':'Masculino'}, ${P.age} anos, ${P.height} cm`:''}</div></div>

/* ---------- navegação e render ---------- */
function navHtml(r){return [['hoje','Hoje','home'],['buscar','Buscar','search'],['historico','Histórico','bars'],['progresso','Progresso','trend'],['perfil','Meus dados','user']].map(([k,l,i])=>`<button class="${r===k?'on':''}" data-act="tab" data-v="${k}">${ico(i)}${l}</button>`).join('');}
function sysDark(){if(HAS_ANDROID){try{return !!Android.isDark();}catch(e){}}return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(){const dark=S.theme==='escuro'||(S.theme==='auto'&&sysDark());document.documentElement.classList.toggle('dark',dark);if(HAS_ANDROID&&applyTheme._last!==dark){applyTheme._last=dark;try{Android.setBars(dark);}catch(e){}}}
function render(keep){const y=window.scrollY;applyTheme();const r=UI.route;$('#app').innerHTML=(SCREENS[r]||SCREENS.hoje)();const showNav=TABS.includes(r);$('#nav').style.display=showNav?'grid':'none';if(showNav)$('#nav').innerHTML=navHtml(r);window.scrollTo(0,keep?y:0);}
function go(r){UI.stack.push(UI.route);UI.route=r;if(r==='buscar'){UI.q='';UI.online=null;}render();}
function back(){if(UI.sheet){closeSheet();return true;}if(UI.stack.length){UI.route=UI.stack.pop();if(UI.route!=='buscar')UI.mode=null;render();return true;}if(UI.route!=='hoje'){UI.route='hoje';render();return true;}return false;}
window.appBack=()=>back();

/* ---------- ações ---------- */
function setPath(path,v){const parts=path.split('.');let o=parts[0]==='rem'?S:parts[0]==='goal'?S.goals:UI;if(parts[0]==='goal'){o[parts[1]]=Math.round(num(v));save();return;}
 if(parts[0]==='rem'){let x=S.rem;for(let i=1;i<parts.length-1;i++)x=x[parts[i]];const k=parts[parts.length-1];x[k]=isNaN(Number(v))||v===''||/:/.test(v)?v:Number(v);save();pushReminders();return;}
 for(let i=0;i<parts.length-1;i++)o=o[parts[i]];const k=parts[parts.length-1];o[k]=(typeof o[k]==='number')?num(v):v;}
const ACT={
 start(){UI.route='perfil';UI.stack=[];render();},
 tab(d){UI.stack=[];UI.route=d.v;if(d.v==='buscar'){UI.q='';UI.online=null;UI.mode=null;}if(d.v==='hoje')UI.day=today();render();},
 go(d){if(d.v==='buscar')UI.mode=null;if(d.v==='rotulo')UI.rot=null;if(d.v==='monjaro')UI.mjf=null;go(d.v);},back(){back();},
 dayNav(d){const n=addD(UI.day,Number(d.v));if(n<=today()){UI.day=n;render();}},
 set(d){if(d.k==='theme'){S.theme=d.v;save();render(true);return;}if(d.k==='hist'){UI.hist=Number(d.v);render(true);return;}

  if(d.k==='tab'){UI.tab=d.v;render(true);return;}
  setPath(d.k,d.v);render(true);},
 water(d){S.water.push({id:uid(),date:UI.day,ml:Number(d.v),t:Date.now()});save();render(true);const w=waterOf(UI.day);if(w>=S.goals.water&&w-Number(d.v)<S.goals.water)toast('Meta de água batida! O Rolinho agradece.');},
 waterUndo(){for(let i=S.water.length-1;i>=0;i--)if(S.water[i].date===UI.day){S.water.splice(i,1);break;}save();render(true);},
 delEntry(d){S.log=S.log.filter(e=>e.id!==d.v);save();render(true);},
 delAct(d){S.acts=S.acts.filter(a=>a.id!==d.v);save();render(true);},
 ck(d){const c=S.checkins[UI.day]||(S.checkins[UI.day]={});c[d.f]=c[d.f]===d.v?undefined:d.v;save();render(true);},
 sym(d){const c=S.checkins[today()]||(S.checkins[today()]={});c.sym=c.sym||[];const i=c.sym.indexOf(d.v);if(i>=0)c.sym.splice(i,1);else c.sym.push(d.v);save();render(true);},
 pick(d){const f=LIST[Number(d.i)];if(!f)return;const units=Object.keys(f.units||{});const k=key(f.name);const prev=S.foods[k];
  const unit=prev&&prev.lastUnit&&(prev.lastUnit==='g'||prev.lastUnit==='ml'||units.includes(prev.lastUnit))?prev.lastUnit:(units[0]||'g');
  UI.sel={food:f,unit,qty:prev&&prev.lastQty&&prev.lastUnit===unit?prev.lastQty:(unit==='g'||unit==='ml'?100:1)};openSheet(sheetFood);},
 qty(d){const s=UI.sel;const step=(s.unit==='g'||s.unit==='ml')?10:(s.qty<1||(s.qty===1&&Number(d.v)<0)?0.5:1);s.qty=Math.max(0,Math.round((s.qty+Number(d.v)*step)*10)/10);refreshSheet();},
 unit(d){const s=UI.sel;s.unit=d.v;s.qty=(d.v==='g'||d.v==='ml')?100:1;refreshSheet();},
 fav(){const f=UI.sel.food,k=key(f.name);const cur=S.foods[k]||Object.assign({},f);cur.fav=!cur.fav;S.foods[k]=cur;save();refreshSheet();},
 confirmAdd(){const s=UI.sel,f=s.food;const grams=(s.unit==='g'||s.unit==='ml')?s.qty:(f.units[s.unit]||0)*s.qty;if(!(grams>0)){toast('Informe a quantidade.');return;}
  const k=key(f.name);const cur=Object.assign({},f,S.foods[k]||{});cur.uses=(cur.uses||0)+1;cur.last=Date.now();cur.lastUnit=s.unit;cur.lastQty=s.qty;delete cur.alias;S.foods[k]=Object.assign(cur,{alias:f.alias});
  if(UI.mode==='recipe'){UI.recipe.items.push({name:f.name,grams,per100:f.per100});save();closeSheet();UI.mode=null;UI.route=UI.stack.pop()||'receita';render();return;}
  const m=macrosFor(f,grams);const qt=(s.unit==='g'||s.unit==='ml')?nf(s.qty)+' '+s.unit:nf(s.qty,1)+' '+(s.qty>1?plural(s.unit):s.unit)+' · '+nf(grams)+' g';
  S.log.push(Object.assign({id:uid(),date:UI.day,meal:UI.meal,name:f.name,grams,qtyText:qt,vf:!!f.vf,t:Date.now()},m));save();closeSheet();toast('Adicionado: '+f.name);render(true);},
 copyY(){const y=dayEntries(addD(UI.day,-1)).filter(e=>e.meal===UI.meal);y.forEach(e=>S.log.push(Object.assign({},e,{id:uid(),date:UI.day,t:Date.now()})));save();toast(y.length+' itens copiados');UI.stack=[];UI.route='hoje';render();},
 saveMeal(d){const es=dayEntries(UI.day).filter(e=>e.meal===d.v);UI.saveName=d.v+' de sempre';openSheet(()=>`<div class="b">Salvar refeição</div><span class="s m">${esc(es.map(e=>e.name).join(', '))}</span><input class="inp" data-in="saveName" value="${esc(UI.saveName)}"><button class="btn" data-act="confirmSaveMeal" data-v="${esc(d.v)}">Salvar</button>`);},
 confirmSaveMeal(d){const es=dayEntries(UI.day).filter(e=>e.meal===d.v).map(e=>({name:e.name,grams:e.grams,qtyText:e.qtyText,kcal:e.kcal,p:e.p,c:e.c,g:e.g,f:e.f||0,vf:e.vf}));S.saved.push({id:uid(),name:UI.saveName||d.v,items:es});save();closeSheet();toast('Refeição salva');},
 addSaved(d){const s=S.saved.find(x=>x.id===d.v);if(!s)return;s.items.forEach(i=>S.log.push(Object.assign({},i,{id:uid(),date:UI.day,meal:UI.meal,t:Date.now()})));save();toast(s.name+' adicionado');UI.stack=[];UI.route='hoje';render();},
 delSaved(d){S.saved=S.saved.filter(x=>x.id!==d.v);save();render(true);},
 online(){const q=UI.q.trim();if(!q)return;UI.online={loading:true};render(true);
  fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=20&fields=code,product_name,brands,nutriments,serving_quantity').then(r=>r.json()).then(j=>{UI.online={res:(j.products||[]).map(offFood).filter(Boolean)};render(true);}).catch(()=>{UI.online={err:'Não consegui buscar online. Confira a internet e tente de novo.'};render(true);});},
 barcode(){openSheet(()=>`<div class="b">Código de barras</div><span class="s m">Digite os números embaixo do código de barras do produto.</span><input class="inp" inputmode="numeric" id="codeIn" placeholder="Ex.: 7891000100103"><button class="btn" data-act="codeSearch">Buscar produto</button>${'BarcodeDetector' in window?'<button class="btn2" data-act="cam">Ler pela câmera</button>':''}<div id="codeMsg" class="s m"></div>`);},
 cam(){$('#camIn').click();},
 codeSearch(){const c=($('#codeIn').value||'').replace(/\D/g,'');if(c.length<8){$('#codeMsg').textContent='Código incompleto.';return;}lookupCode(c);},
 saveRot(){const r=UI.rot;if(!r.name.trim()||!(num(r.kcal)>=0)||r.kcal===''){toast('Preencha o nome e as calorias.');return;}
  const f={name:r.name.trim(),per100:{kcal:num(r.kcal),p:num(r.p),c:num(r.c),g:num(r.g),f:num(r.f)},units:num(r.porc)>0?{'porção':num(r.porc)}:{},src:'user',custom:true};
  S.foods[key(f.name)]=f;save();UI.rot=null;UI.route=UI.stack.pop()||'buscar';UI.q=f.name;render();LIST=[f];UI.sel={food:f,unit:Object.keys(f.units)[0]||'g',qty:Object.keys(f.units).length?1:100};openSheet(sheetFood);},
 newRecipe(){UI.recipe={name:'',items:[],portions:4};go('receita');},
 addIng(){UI.mode='recipe';UI.q='';UI.online=null;UI.tab='recentes';go('buscar');},
 delIng(d){UI.recipe.items.splice(Number(d.v),1);render(true);},
 portions(d){UI.recipe.portions=clamp((UI.recipe.portions||1)+Number(d.v),1,50);render(true);},
 saveRecipe(){const R=UI.recipe;if(!R.name.trim()||!R.items.length){toast('Dê um nome e adicione ingredientes.');return;}
  const T=R.items.reduce((a,i)=>{const m=macrosFor(i,i.grams);return{kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,g:a.g+m.g,f:a.f+m.f,gr:a.gr+i.grams}},{kcal:0,p:0,c:0,g:0,f:0,gr:0});
  const k=T.gr/100;S.foods[key(R.name)]={name:R.name.trim(),per100:{kcal:T.kcal/k,p:T.p/k,c:T.c/k,g:T.g/k,f:T.f/k},units:{'porção':T.gr/R.portions},recipe:true,fav:true,src:'user',items:R.items};
  save();toast('Receita salva');UI.recipe=null;UI.stack=[];UI.route='buscar';UI.tab='receitas';UI.q='';render();},
 saveAct(){const a=Object.assign({},UI.draftAct);a.min=Math.max(1,Math.round(num(a.min)));S.acts.push({id:uid(),date:UI.day,type:a.type,int:a.int,min:a.min,kcal:Math.round(actKcal(a))});save();toast('Atividade salva');back();},
 calcGoals(){const f=UI.pf;const P={sex:f.sex||'F',age:num(f.age),weight:num(f.weight),height:num(f.height),act:num(f.act)||1.375,def:num(f.def)||500};
  if(!(P.age>0&&P.weight>0&&P.height>0)){toast('Preencha idade, peso e altura.');return;}
  const first=!S.profile;S.profile=P;if(!S.weights.length)S.weights.push({date:today(),kg:P.weight});const g=suggestGoals(P,curWeight());S.goals=Object.assign(S.goals,{kcal:g.kcal,p:g.p,c:g.c,g:g.g,f:g.f,water:g.water});save();pushReminders();
  toast('Metas calculadas: '+nf(g.kcal)+' kcal'+(g.floored?' (mínimo recomendado)':''));if(first){UI.stack=[];UI.route='hoje';}render();},
 addWeight(){const v=num($('#wIn').value);if(!(v>25&&v<400)){toast('Peso inválido.');return;}S.weights=S.weights.filter(w=>w.date!==today());S.weights.push({date:today(),kg:v});save();toast('Peso registrado');render(true);},
 applyCal(){const c=calibration();if(!c||c.adj==null)return;S.tdeeAdj=(S.tdeeAdj||0)+c.adj;const floor=S.profile.sex==='M'?1500:1200;S.goals.kcal=Math.max(floor,Math.round(baseGasto()-S.profile.def));save();toast('Gasto e meta ajustados');render(true);},
 tog(d){const[a,b]=d.k.split('.');S.rem[a][b]=!S.rem[a][b];save();pushReminders();render(true);},
 remN(d){S.rem.meals.count=clamp(S.rem.meals.count+Number(d.v),1,8);save();pushReminders();render(true);},
 battery(){try{Android.openBatterySettings();}catch(e){}},
 periodToday(){addPeriod(today());},
 delPeriod(d){S.cycle.starts=S.cycle.starts.filter(s=>s!==d.v);save();render(true);},
 saveMj(){const f=UI.mjf;if(!f.date){toast('Escolha a data.');return;}S.mj.apps.push({id:uid(),date:f.date,dose:f.dose.trim(),site:f.site});if(f.dose.trim())S.mj.dose=f.dose.trim();save();pushReminders();UI.mjf=null;toast('Aplicação registrada');render(true);},
 delMj(d){S.mj.apps=S.mj.apps.filter(a=>a.id!==d.v);save();pushReminders();render(true);},
 side(d){const s=S.mj.sides[today()]||(S.mj.sides[today()]={});s[d.k]=Number(d.v);save();render(true);},
 wear(d){S.wear=S.wear===d.v?null:d.v;save();render(true);},
 shareWeek(){const t=weekText();if(HAS_ANDROID){try{Android.shareText(t);return;}catch(e){}}if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Resumo copiado'));},
 print(){if(HAS_ANDROID){try{Android.printPage('Relatorio-Meu-Monstrinho');return;}catch(e){}}window.print();},
 exportB(){const txt=JSON.stringify(S);const name='meu-monstrinho-backup-'+today()+'.json';if(HAS_ANDROID){try{Android.saveFile(name,txt);return;}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();},
 importB(){$('#fileIn').click();},
 openDay(d){UI.day=d.v;UI.stack=[];UI.route='hoje';render();},
 closeSheet(){closeSheet();}};
function addPeriod(d){if(!d)return;S.cycle.starts=[...new Set([...(S.cycle.starts||[]),d])].sort();save();toast('Ciclo atualizado');render(true);}
function offFood(p){const n=p.nutriments||{};let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;if(kcal==null||!p.product_name)return null;
 const name=(p.product_name+(p.brands?' · '+String(p.brands).split(',')[0]:'')).trim();const sq=num(p.serving_quantity);
 return{name,per100:{kcal:num(kcal),p:num(n.proteins_100g),c:num(n.carbohydrates_100g),g:num(n.fat_100g),f:num(n.fiber_100g)},units:sq>0?{'porção':sq}:{},src:'off',code:p.code};}
function lookupCode(c){const msg=$('#codeMsg');if(msg)msg.textContent='Buscando…';
 fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=code,product_name,brands,nutriments,serving_quantity').then(r=>r.json()).then(j=>{const f=j&&j.product?offFood(j.product):null;
  if(!f){if($('#codeMsg'))$('#codeMsg').innerHTML='Produto não encontrado. <a href="#" data-act="go" data-v="rotulo">Cadastrar pelo rótulo</a>';return;}
  LIST=[f];UI.sel={food:f,unit:Object.keys(f.units)[0]||'g',qty:Object.keys(f.units).length?1:100};openSheet(sheetFood);}).catch(()=>{if($('#codeMsg'))$('#codeMsg').textContent='Sem conexão. Tente de novo.';});}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();const fn=ACT[el.dataset.act];if(fn){if(el.dataset.act==='go'&&UI.sheet)closeSheet();fn(el.dataset,el);}});
document.addEventListener('input',e=>{const el=e.target;const p=el.dataset&&el.dataset.in;if(!p)return;
 if(p==='q'){UI.q=el.value;UI.online=null;clearTimeout(UI._qt);UI._qt=setTimeout(()=>{const pos=el.selectionStart;render(true);const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}},250);return;}
 if(p==='qty'){UI.sel.qty=num(el.value);clearTimeout(UI._st);UI._st=setTimeout(()=>{const pos=el.selectionStart;refreshSheet();const n=document.querySelector('[data-in="qty"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}},400);return;}
 if(p==='saveName'){UI.saveName=el.value;return;}
 if(p.startsWith('goal.')||p.startsWith('rem.'))return;
 if(p==='perDate')return;
 setPath(p,el.value);});
document.addEventListener('change',e=>{const el=e.target;const p=el.dataset&&el.dataset.in;if(!p)return;
 if(p.startsWith('goal.')){setPath(p,el.value);return;}
 if(p.startsWith('rem.')){setPath(p,el.value);render(true);return;}
 if(p==='perDate'){addPeriod(el.value);return;}
 if(p==='draftAct.min'||p==='pf.act'||p==='mjf.site'){setPath(p,el.value);render(true);}});
$('#fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.log))throw 0;
 openSheet(()=>`<div class="b">Importar backup?</div><span class="s m">Isso substitui os dados atuais do app pelos do arquivo (${d.log.length} registros de comida).</span><button class="btn" data-act="doImport">Importar</button><button class="btn2" data-act="closeSheet">Cancelar</button>`);UI._imp=d;}catch(x){toast('Esse arquivo não é um backup do app.');}};r.readAsText(f);e.target.value='';});
ACT.doImport=()=>{localStorage.setItem('mm_v1',JSON.stringify(UI._imp));load();save();pushReminders();closeSheet();UI.stack=[];UI.route='hoje';render();toast('Backup importado');};
$('#camIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const bd=new BarcodeDetector();const img=await createImageBitmap(f);const r=await bd.detect(img);if(r.length){const c=r[0].rawValue.replace(/\D/g,'');const ci=$('#codeIn');if(ci)ci.value=c;lookupCode(c);}else toast('Não achei o código na foto. Tente de mais perto.');}catch(x){toast('Não deu para ler. Digite os números.');}});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')render(true);});

/* ---------- ponte com o Android ---------- */
function pushStatus(){if(!HAS_ANDROID)return;try{const d=today(),t=tot(dayEntries(d));const lastF=Math.max(0,...dayEntries(d).map(e=>e.t||0),...S.log.map(e=>e.t||0));
 Android.setStatus(JSON.stringify({date:d,waterMl:waterOf(d),waterGoal:S.goals.water,proteinPct:S.goals.p?t.p/S.goals.p:1,lastFood:lastF,mood:moodOf(d)}));}catch(e){}}
function pushReminders(){if(!HAS_ANDROID)return;try{const R=S.rem;const nx=mjNext();const mjEvents=[];
 if(R.mj.on&&nx){mjEvents.push({at:addD(nx,-1)+' 20:00',title:'Amanhã é dia de Monjaro',body:'Aplicação marcada para amanhã. Próximo local no rodízio: '+nextSite()+'.'});mjEvents.push({at:nx+' 09:00',title:'Hoje é dia de Monjaro',body:'Depois de aplicar, registre no app para manter o rodízio em dia.'});}
 Android.setReminders(JSON.stringify({meals:{on:R.meals.on,times:mealTimes(),fast:R.meals.fast},water:R.water,protein:R.protein,mj:mjEvents,
  phrases:{meal:PHR.fome,water:['Bora beber água? Um copinho já me deixa feliz.','Já acabou a água? Enche de novo!'],protein:['Faltou proteína hoje. Que tal um whey, iogurte ou ovos?']}}));}catch(e){}}
